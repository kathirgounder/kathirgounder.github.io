<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Project — Kathir</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Spectral:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="nav">
    <a class="brand" href="index.html">Kathir</a>
    <div class="links">
      <a href="index.html#projects">Projects</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </div>
    <div class="spacer"></div>
    <a class="btn ghost" href="mailto:kathirgounder@gmail.com">Email</a>
    <a class="btn solid" href="https://github.com/kathirgounder" target="_blank" rel="noopener">GitHub</a>
  </nav>

  <main class="section wrap">
    <article class="post" id="post">
      <a class="back" href="index.html#projects">&larr; Back to projects</a>
      <div id="post-content"><!-- injected --></div>
    </article>
  </main>

  <footer class="footer-bar">
    <div class="wrap">
      <span>Let's build something — <a href="mailto:kathirgounder@gmail.com">kathirgounder@gmail.com</a></span>
      <span class="small">© <span id="year"></span> Kathir</span>
    </div>
  </footer>

  <script src="projects.js"></script>
  <script>
    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    const id = getParam('id');
    const project = (window.PROJECTS || []).find(function (p) { return p.id === id; });
    const mount = document.getElementById('post-content');
    document.getElementById('year').textContent = new Date().getFullYear();

    if (!project) {
      mount.innerHTML = '<h1>Project not found</h1>'
        + '<p class="subtitle">No project matches <code>' + escapeHtml(id || '') + '</code>.</p>';
    } else {
      document.title = project.title + ' — Kathir';

      // links row
      const L = project.links || {};
      const linkBtns = []
        .concat(L.github ? '<a class="btn orange" href="' + L.github + '" target="_blank" rel="noopener">GitHub repo</a>' : [])
        .concat(L.codepen ? '<a class="btn ghost" href="' + L.codepen + '" target="_blank" rel="noopener">CodePen</a>' : [])
        .concat(L.live ? '<a class="btn solid" href="' + L.live + '" target="_blank" rel="noopener">Live demo</a>' : [])
        .join('');

      // body blocks (p / h)
      const body = (project.body || []).map(function (block) {
        if (block.h) return '<h2>' + escapeHtml(block.h) + '</h2>';
        if (block.p) return '<p>' + block.p + '</p>'; // HTML intentionally allowed in paragraphs
        return '';
      }).join('');

      const vids = project.videos || [];
      const isCluster = project.cluster && vids.length;

      // media: either an overlapping play-all cluster, or a stacked list
      let media = '';
      if (isCluster) {
        const bubbles = vids.slice(0, 4).map(function (v, i) {
          return '<button class="bubble b' + (i + 1) + '" data-i="' + i + '" title="' + escapeHtml(v.label || '') + '" aria-label="' + escapeHtml(v.label || 'Video') + '">'
            + '<video src="' + (v.card || v.src) + '" muted playsinline loop autoplay></video>'
            + '<span class="bubble-label">' + escapeHtml(v.label || '') + '</span>'
            + '</button>';
        }).join('');
        media = '<div class="cluster-wrap"><div class="cluster cluster--lg">' + bubbles + '</div>'
          + '<p class="cluster-legend">All playing at once — click any to watch full-size.</p></div>';
      } else {
        media = vids.map(function (v) {
          return '<figure>'
            + '<video src="' + v.src + '" controls muted playsinline loop preload="metadata"></video>'
            + (v.caption ? '<figcaption>' + escapeHtml(v.caption) + '</figcaption>' : '')
            + '</figure>';
        }).join('');
        media = media ? '<div class="media">' + media + '</div>' : '';
      }

      mount.innerHTML = ''
        + '<h1>' + escapeHtml(project.title) + '</h1>'
        + (project.subtitle ? '<p class="subtitle">' + escapeHtml(project.subtitle) + '</p>' : '')
        + (project.date ? '<p class="meta">' + escapeHtml(project.date) + '</p>' : '')
        + (linkBtns ? '<div class="links">' + linkBtns + '</div>' : '')
        + media
        + '<div class="body">' + body + '</div>';

      // ---- video lightbox for cluster bubbles ----
      if (isCluster) {
        const lb = document.createElement('div');
        lb.className = 'lightbox';
        lb.innerHTML = '<button class="lb-close" aria-label="Close">&times;</button>'
          + '<button class="lb-nav lb-prev" aria-label="Previous">&#8249;</button>'
          + '<button class="lb-nav lb-next" aria-label="Next">&#8250;</button>'
          + '<figure><video controls muted loop playsinline></video><figcaption></figcaption></figure>';
        document.body.appendChild(lb);
        const lbVid = lb.querySelector('video');
        const lbCap = lb.querySelector('figcaption');
        let cur = 0;

        function showAt(i) {
          cur = (i + vids.length) % vids.length;
          const v = vids[cur];
          lbVid.src = v.src;
          lbVid.play().catch(function () {});
          lbCap.textContent = v.caption || v.label || '';
          lbCap.style.display = (v.caption || v.label) ? '' : 'none';
        }
        function open(i) { showAt(i); lb.classList.add('open'); document.body.classList.add('lb-open'); }
        function close() { lb.classList.remove('open'); document.body.classList.remove('lb-open'); lbVid.pause(); }

        mount.querySelectorAll('.cluster .bubble').forEach(function (b) {
          b.addEventListener('click', function () { open(parseInt(b.getAttribute('data-i'), 10)); });
        });
        lb.querySelector('.lb-close').addEventListener('click', close);
        lb.querySelector('.lb-prev').addEventListener('click', function (e) { e.stopPropagation(); showAt(cur - 1); });
        lb.querySelector('.lb-next').addEventListener('click', function (e) { e.stopPropagation(); showAt(cur + 1); });
        lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
        document.addEventListener('keydown', function (e) {
          if (!lb.classList.contains('open')) return;
          if (e.key === 'Escape') close();
          else if (e.key === 'ArrowLeft') showAt(cur - 1);
          else if (e.key === 'ArrowRight') showAt(cur + 1);
        });
      }
    }
  </script>
</body>
</html>
