<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Project — Kathir</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Spectral:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="nav">
    <a class="brand" href="index.html">Kathir</a>
    <div class="links">
      <a href="index.html#projects">Projects</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </div>
    <div class="spacer"></div>
    <a class="btn ghost" href="mailto:kathirgounder@gmail.com">Email</a>
    <a class="btn solid" href="https://github.com/kathirgounder" target="_blank" rel="noopener">GitHub</a>
  </nav>

  <main class="section wrap">
    <article class="post" id="post">
      <a class="back" href="index.html#projects">&larr; Back to projects</a>
      <div id="post-content"><!-- injected --></div>
    </article>
  </main>

  <footer class="footer-bar">
    <div class="wrap">
      <span>Let's build something — <a href="mailto:kathirgounder@gmail.com">kathirgounder@gmail.com</a></span>
      <span class="small">© <span id="year"></span> Kathir</span>
    </div>
  </footer>

  <script src="projects.js?v=2"></script>
  <script>
    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    const id = getParam('id');
    const project = (window.PROJECTS || []).find(function (p) { return p.id === id; });
    const mount = document.getElementById('post-content');
    document.getElementById('year').textContent = new Date().getFullYear();

    if (!project) {
      mount.innerHTML = '<h1>Project not found</h1>'
        + '<p class="subtitle">No project matches <code>' + escapeHtml(id || '') + '</code>.</p>';
    } else {
      document.title = project.title + ' — Kathir';

      // links row
      const L = project.links || {};
      const linkBtns = []
        .concat(L.github ? '<a class="btn orange" href="' + L.github + '" target="_blank" rel="noopener">GitHub repo</a>' : [])
        .concat(L.codepen ? '<a class="btn ghost" href="' + L.codepen + '" target="_blank" rel="noopener">CodePen</a>' : [])
        .concat(L.live ? '<a class="btn solid" href="' + L.live + '" target="_blank" rel="noopener">Live demo</a>' : [])
        .join('');

      // body blocks (p / h)
      const body = (project.body || []).map(function (block) {
        if (block.h) return '<h2>' + escapeHtml(block.h) + '</h2>';
        if (block.p) return '<p>' + block.p + '</p>'; // HTML intentionally allowed in paragraphs
        return '';
      }).join('');

      const vids = project.videos || [];
      const isCluster = project.cluster && vids.length;

      // media: either an overlapping play-all cluster, or a stacked list
      let media = '';
      if (isCluster) {
        const circles = vids.map(function (v, i) {
          return '<button class="bubble' + (v.splat ? '' : ' pc') + '" data-i="' + i + '"' + (v.splat ? ' data-splat="1"' : '')
            + ' title="' + escapeHtml(v.label || '') + '" aria-label="' + escapeHtml(v.label || 'Video') + '">'
            + '<video src="' + (v.card || v.src) + '" muted playsinline loop autoplay></video>'
            + '<span class="bubble-label">' + escapeHtml(v.label || '') + '</span>'
            + '</button>';
        }).join('');
        media = '<div class="vcluster" id="vcluster">' + circles + '</div>'
          + '<p class="cluster-legend">All playing at once — click any to watch full-size.</p>';
      } else {
        media = vids.map(function (v) {
          return '<figure>'
            + '<video src="' + v.src + '" controls muted playsinline loop preload="metadata"></video>'
            + (v.caption ? '<figcaption>' + escapeHtml(v.caption) + '</figcaption>' : '')
            + '</figure>';
        }).join('');
        media = media ? '<div class="media">' + media + '</div>' : '';
      }

      mount.innerHTML = ''
        + '<h1>' + escapeHtml(project.title) + '</h1>'
        + (project.subtitle ? '<p class="subtitle">' + escapeHtml(project.subtitle) + '</p>' : '')
        + (project.date ? '<p class="meta">' + escapeHtml(project.date) + '</p>' : '')
        + (linkBtns ? '<div class="links">' + linkBtns + '</div>' : '')
        + media
        + '<div class="body">' + body + '</div>';

      // ---- scatter the cluster: overlapping point-cloud circles, splat below ----
      if (isCluster) {
        const cluster = document.getElementById('vcluster');
        const circleEls = Array.prototype.slice.call(cluster.querySelectorAll('.bubble'));
        const pcs = circleEls.filter(function (b) { return !b.hasAttribute('data-splat'); });
        const splat = circleEls.filter(function (b) { return b.hasAttribute('data-splat'); })[0];
        function rnd(s) { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

        function layoutCluster() {
          const W = cluster.clientWidth;
          const n = pcs.length;
          const d = Math.round(W * (n >= 5 ? 0.32 : (n >= 4 ? 0.36 : 0.42)));
          const step = n > 1 ? (W - d) / (n - 1) : 0;
          const amp = d * 0.16;                              // vertical zig-zag
          const startX = (W - (d + (n - 1) * step)) / 2;
          let bottom = 0;
          pcs.forEach(function (b, i) {
            const jx = (rnd(i + 1) - 0.5) * step * 0.22;
            const jy = (rnd(i + 5) - 0.5) * amp * 0.6;
            const x = Math.max(0, Math.min(W - d, startX + i * step + jx));
            const y = Math.max(0, amp + (i % 2 ? amp : -amp) + jy);
            b.style.width = d + 'px';
            b.style.left = Math.round(x) + 'px';
            b.style.top = Math.round(y) + 'px';
            b.style.zIndex = String(10 + i);
            bottom = Math.max(bottom, y + d);
          });
          if (splat) {                                        // its own circle, centered below with a gap
            const sd = Math.round(d * 1.04);
            splat.style.width = sd + 'px';
            splat.style.left = Math.round((W - sd) / 2) + 'px';
            splat.style.top = Math.round(bottom + d * 0.16) + 'px';
            splat.style.zIndex = '6';
            bottom = bottom + d * 0.16 + sd;
          }
          cluster.style.height = Math.round(bottom + 4) + 'px';
        }
        layoutCluster();
        let crt;
        window.addEventListener('resize', function () { clearTimeout(crt); crt = setTimeout(layoutCluster, 150); });

        // ---- make circles draggable (pointer events; mouse + touch) ----
        let zTop = 30;
        circleEls.forEach(function (b) {
          let sx = 0, sy = 0, ox = 0, oy = 0, down = false;
          b._dragged = false;

          b.addEventListener('pointerdown', function (e) {
            if (e.button && e.button !== 0) return;
            down = true; b._dragged = false;
            sx = e.clientX; sy = e.clientY;
            ox = parseFloat(b.style.left) || 0;
            oy = parseFloat(b.style.top) || 0;
            b.setPointerCapture(e.pointerId);
            b.style.zIndex = String(++zTop);
          });

          b.addEventListener('pointermove', function (e) {
            if (!down) return;
            const dx = e.clientX - sx, dy = e.clientY - sy;
            if (!b._dragged && (Math.abs(dx) + Math.abs(dy)) > 5) {
              b._dragged = true;
              b.classList.add('dragging');
            }
            if (!b._dragged) return;
            const W = cluster.clientWidth, d = b.offsetWidth;
            const nl = Math.max(-d * 0.4, Math.min(W - d * 0.6, ox + dx)); // can nudge past edges
            const nt = Math.max(0, oy + dy);
            b.style.left = Math.round(nl) + 'px';
            b.style.top = Math.round(nt) + 'px';
          });

          function release(e) {
            if (!down) return;
            down = false;
            b.classList.remove('dragging');
            try { b.releasePointerCapture(e.pointerId); } catch (_) {}
            // grow the container if a circle was dragged below it
            const bottom = (parseFloat(b.style.top) || 0) + b.offsetHeight + 4;
            if (bottom > cluster.clientHeight) cluster.style.height = bottom + 'px';
          }
          b.addEventListener('pointerup', release);
          b.addEventListener('pointercancel', release);
        });
      }

      // ---- video lightbox for cluster bubbles ----
      if (isCluster) {
        const lb = document.createElement('div');
        lb.className = 'lightbox';
        lb.innerHTML = '<button class="lb-close" aria-label="Close">&times;</button>'
          + '<button class="lb-nav lb-prev" aria-label="Previous">&#8249;</button>'
          + '<button class="lb-nav lb-next" aria-label="Next">&#8250;</button>'
          + '<figure><video controls muted loop playsinline></video><figcaption></figcaption></figure>';
        document.body.appendChild(lb);
        const lbVid = lb.querySelector('video');
        const lbCap = lb.querySelector('figcaption');
        let cur = 0;

        function showAt(i) {
          cur = (i + vids.length) % vids.length;
          const v = vids[cur];
          lbVid.src = v.src;
          lbVid.play().catch(function () {});
          lbCap.textContent = v.caption || v.label || '';
          lbCap.style.display = (v.caption || v.label) ? '' : 'none';
        }
        function open(i) { showAt(i); lb.classList.add('open'); document.body.classList.add('lb-open'); }
        function close() { lb.classList.remove('open'); document.body.classList.remove('lb-open'); lbVid.pause(); }

        mount.querySelectorAll('.vcluster .bubble').forEach(function (b) {
          b.addEventListener('click', function () {
            if (b._dragged) { b._dragged = false; return; }   // it was a drag, not a tap
            open(parseInt(b.getAttribute('data-i'), 10));
          });
        });
        lb.querySelector('.lb-close').addEventListener('click', close);
        lb.querySelector('.lb-prev').addEventListener('click', function (e) { e.stopPropagation(); showAt(cur - 1); });
        lb.querySelector('.lb-next').addEventListener('click', function (e) { e.stopPropagation(); showAt(cur + 1); });
        lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
        document.addEventListener('keydown', function (e) {
          if (!lb.classList.contains('open')) return;
          if (e.key === 'Escape') close();
          else if (e.key === 'ArrowLeft') showAt(cur - 1);
          else if (e.key === 'ArrowRight') showAt(cur + 1);
        });
      }
    }
  </script>
</body>
</html>
